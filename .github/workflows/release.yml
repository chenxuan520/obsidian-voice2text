name: Release

on:
  push:
    tags:
      - "*"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Lint plugin
        run: npm run lint

      - name: Build plugin
        run: npm run build

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node -e 'const fs=require("fs");
          const tag=process.env.RELEASE_TAG;
          const p=JSON.parse(fs.readFileSync("package.json","utf8"));
          const m=JSON.parse(fs.readFileSync("manifest.json","utf8"));
          const v=JSON.parse(fs.readFileSync("versions.json","utf8"));
          if(tag!==p.version||p.version!==m.version||v[m.version]!==m.minAppVersion)
          throw new Error(`release metadata does not match ${tag}`);'

      - name: Attest release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          main.js
          manifest.json
          styles.css
          --verify-tag
          --generate-notes
          --title "Voice2Text ${RELEASE_TAG}"
